name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NacerInjector_Shizuku_AutoCopy_And_Launch.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        run: |
          unzip -q NacerInjector_Shizuku_AutoCopy_And_Launch.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ] || [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "Android project root not found (expected app/ and build.gradle beside settings.gradle)."
            find extracted -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Raise minSdk for Shizuku API 13.1.5
        run: |
          FILE="$PROJECT_DIR/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+23/minSdkVersion 24/g; s/minSdk[[:space:]]*=[[:space:]]*23/minSdk = 24/g' "$FILE"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*23/minSdk = 24/g' "$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "Could not find app/build.gradle or app/build.gradle.kts"
            exit 1
          fi
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i -E 's/android:minSdkVersion="[0-9]+"/android:minSdkVersion="24"/g' "$MANIFEST"
          fi
          echo "Effective minSdk declarations:"
          grep -RniE 'minSdk|uses-sdk' "$PROJECT_DIR/app/build.gradle" "$PROJECT_DIR/app/build.gradle.kts" "$MANIFEST" 2>/dev/null || true

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: May-app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
