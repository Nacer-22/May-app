name: Build HAX Demo APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Find and extract ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      test -n "$ZIP_FILE" || { echo "ZIP file not found"; exit 1; }
      mkdir extracted
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
      test -n "$PROJECT_DIR" || { echo "Android project not found"; exit 1; }
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install SDK
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle :app:assembleDebug

  - name: Prepare APK
    run: |
      mkdir -p output
      find extracted -name app-debug.apk -exec cp {} output/app-debug.apk \;
      test -f output/app-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: HAX-NON-ROOT-Demo-APK
      path: output/app-debug.apk
