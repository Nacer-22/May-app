<!DOCTYPE html>
<html lang="en" id="html-root" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0000" />
  <title>Nacer_x_Rida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css" />

  <style>
    :root {
      --bg-color: #050000;
      --card-bg: #120606;
      --border-color: #2a0b0b;
      --accent-red: #ff1f1f;
      --text-main: #fff5f5;
      --text-muted: #b08a8a;
      --font-title: 'Anton', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at 20% 0%, #2a0000 0%, #050000 45%, #000 100%); color: var(--text-main); font-family: var(--font-mono); min-height: 100vh; overflow-x: hidden; display: flex; justify-content: center; }
    .theme-bar { position: fixed; top: 10px; right: 10px; z-index: 50; display:flex; gap:6px; }
    .theme-bar button { border:1px solid #ff2a2a55; background:#140404cc; color:#ffdede; border-radius:999px; padding:6px 10px; font: 11px var(--font-mono); cursor:pointer; backdrop-filter: blur(8px); }
    .theme-bar button:hover { box-shadow:0 0 14px #ff1f1f44; }

    #app { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

    .login-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .brand-logo-img { max-width: 190px; width: 100%; height: auto; margin-bottom: 24px; filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4)); object-fit: contain; }
    .login-title { font-family: var(--font-title); font-size: 42px; letter-spacing: 2px; color: #fff; text-transform: uppercase; margin-bottom: 4px; }
    .login-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 32px; font-weight: 600; }

    .input-label-cyber { width: 100%; text-align: left; font-size: 10px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .input-label-cyber::before { content: ""; width: 5px; height: 5px; background: var(--accent-red); }

    .key-input-cyber-wrap { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); display: flex; align-items: center; padding: 4px; margin-bottom: 20px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
    .key-input-cyber { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: var(--font-mono); font-size: 13px; padding: 12px; text-align: center; font-weight: 700; letter-spacing: 1.5px; }
    .key-input-cyber::placeholder { color: #3f3f46; }
    
    .paste-btn-cyber { background: #18181c; border: 1px solid #2a2a30; color: #fff; padding: 10px 16px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%); transition: background 0.2s; }
    
    .btn-unlock-cyber { width: 100%; background: var(--accent-red); color: #ffffff; border: none; padding: 18px; font-family: var(--font-title); font-size: 22px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); box-shadow: 0 8px 25px rgba(229, 9, 20, 0.35); margin-bottom: 28px; transition: transform 0.2s; }
    .btn-unlock-cyber:active { transform: scale(0.98); }
  </style>
</head>
<body data-theme="redblack">
  <canvas id="nxr-fx-canvas" aria-hidden="true"></canvas>
  <div class="theme-bar" aria-label="Themes">
    <button type="button" data-set-theme="redblack">Red/Black</button>
    <button type="button" data-set-theme="crimson">Crimson</button>
    <button type="button" data-set-theme="ember">Ember</button>
  </div>

  <div id="app" style="position:relative;z-index:1;">
    <div class="login-container">
      <img src="logo.png" alt="Nacer_x_Rida" class="brand-logo-img" onerror="this.onerror=null; this.style.display='none';" />
      <h1 class="login-title">Nacer_x_Rida</h1>
      <p class="login-sub">NO ACCOUNT. NO PASSWORD. JUST YOUR KEY.</p>

      <div class="input-label-cyber">ACCESS KEY</div>
      <div class="key-input-cyber-wrap">
        <input type="text" id="access-key-input" class="key-input-cyber" placeholder="NACER-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="19" />
        <button type="button" class="paste-btn-cyber" id="paste-btn">PASTE</button>
      </div>

      <button type="button" class="btn-unlock-cyber" id="unlock-btn">UNLOCK</button>

      <p style="font-size: 11px; color: var(--text-muted); line-height: 1.6;">
        No key? Contact your seller.<br>
        <span style="font-size: 10px; color: #3f3f46;">Time starts upon connection.</span>
      </p>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
  <script>
    document.getElementById('paste-btn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('access-key-input').value = text.trim();
      } catch (err) { alert('Please allow clipboard permission'); }
    });

    // Nacer_x_Rida themes + visual effects
    (function(){
      const root = document.documentElement;
      const saved = localStorage.getItem('nxr_theme') || 'redblack';
      root.setAttribute('data-theme', saved);
      document.body.setAttribute('data-theme', saved);
      document.querySelectorAll('[data-set-theme]').forEach(btn=>{
        const apply=()=>{ const t=btn.getAttribute('data-set-theme'); root.setAttribute('data-theme',t); document.body.setAttribute('data-theme',t); localStorage.setItem('nxr_theme',t); };
        btn.addEventListener('click', apply);
      });
      const c = document.getElementById('nxr-fx-canvas');
      if(!c) return;
      const ctx = c.getContext('2d');
      let w,h,pts=[];
      function resize(){ w=c.width=innerWidth; h=c.height=innerHeight; pts=Array.from({length: Math.min(70, Math.floor(w*h/22000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:Math.random()*.5+.15})); }
      addEventListener('resize', resize); resize();
      function draw(){
        ctx.clearRect(0,0,w,h);
        for(const p of pts){
          p.x+=p.vx; p.y+=p.vy;
          if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,40,40,${p.a})`; ctx.fill();
        }
        for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
          const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
          if(d<14000){ ctx.strokeStyle=`rgba(255,30,30,${(1-d/14000)*.12})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
