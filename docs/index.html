<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>Nacer_X_Rida</title>
  <link rel="stylesheet" href="src/styles.css">
  <style>
    :root{--bg:#050505;--panel:#0b0b0d;--red:#e50914;--red2:#7f0008;--text:#fff;--muted:#8a8a91}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 15%,rgba(229,9,20,.18),transparent 36%),linear-gradient(145deg,#050505 0%,#090909 48%,#160205 100%)}
    #app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .shell{width:min(100%,430px);position:relative;padding:28px;border:1px solid rgba(229,9,20,.35);background:linear-gradient(145deg,rgba(18,18,20,.96),rgba(5,5,5,.98));box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 55px rgba(229,9,20,.12);clip-path:polygon(0 0,96% 0,100% 7%,100% 100%,4% 100%,0 93%)}
    .glow{position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(120deg,transparent 20%,rgba(229,9,20,.18),transparent 70%);opacity:.8}
    .brand{text-align:center;position:relative}.brand img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(229,9,20,.55));margin:0 auto 10px;display:block}.brand h1{margin:0;font-size:34px;letter-spacing:3px;font-weight:900}.brand p{margin:8px 0 26px;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
    .label{display:block;color:#aaaab0;font-size:10px;font-weight:800;letter-spacing:1.8px;margin:0 0 8px}.field{display:flex;gap:8px;padding:4px;background:#080809;border:1px solid #26262b;box-shadow:inset 0 0 25px rgba(0,0,0,.5);margin-bottom:14px}.field input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:15px 12px;font-size:14px;font-weight:800;letter-spacing:1.4px;text-align:center}.field input::placeholder{color:#45454b}.paste{border:1px solid #2d2d32;background:#151518;color:#ddd;padding:0 13px;font-weight:800;font-size:10px;cursor:pointer}
    .unlock{width:100%;border:0;background:linear-gradient(135deg,#ff1b27 0%,#b00009 55%,#620005 100%);color:#fff;padding:17px;font-size:18px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 12px 30px rgba(229,9,20,.25);transform:translateZ(0)}.unlock:disabled{opacity:.6;cursor:wait}
    .status{display:none;margin-top:16px;padding:14px;border:1px solid rgba(229,9,20,.35);background:#09090a;text-align:center}.status.show{display:block}.status strong{display:block;color:#ff4b53;margin-bottom:5px}.status span{color:#aaa;font-size:11px}
    .foot{text-align:center;margin-top:20px;color:#4f4f55;font-size:9px;letter-spacing:1px}
  </style>
</head>
<body>
<div id="app">
  <main class="shell">
    <div class="glow"></div>
    <section class="brand">
      <img src="logo.png" alt="Nacer_X_Rida">
      <h1>Nacer_X_Rida</h1>
      <p>Secure access</p>
    </section>
    <label class="label" for="access-key-input">ACCESS KEY</label>
    <div class="field">
      <input id="access-key-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="19" placeholder="PWUP-XXXX-XXXX-XXXX">
      <button class="paste" id="paste-btn" type="button">PASTE</button>
    </div>
    <button class="unlock" id="unlock-btn" type="button">UNLOCK</button>
    <div class="status" id="status"><strong id="status-title">ACCESS GRANTED</strong><span id="status-text"></span></div>
    <div class="foot">Nacer_X_Rida • ACCESS SYSTEM</div>
  </main>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
