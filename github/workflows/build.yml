name: Build APK from ZIP

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download repository files
uses: actions/checkout@v4

  - name: Find and extract project ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository root"
        exit 1
      fi
      mkdir extracted
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: settings.gradle not found inside ZIP"
        find extracted -maxdepth 4 -type f
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: HAX-NON-ROOT-Demo-APK
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
